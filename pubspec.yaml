name: tictactoe
description: "A simple Tic Tac Toe game built with Flutter."
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.5.0 # Or your current Dart SDK version

dependencies:
  flutter:
    sdk: flutter

  # Cupertino icons are included by default for iOS style icons if needed
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # If you want to add custom assets (like images or fonts) later, 
  # you can define them here:
  # assets:
  #   - images/